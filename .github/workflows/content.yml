name: Content toolchains

# Runs the content pipeline with every language toolchain (§5.2). The regular CI job runs the
# toolchain-free `pnpm content:check`; this job adds gofmt, javac, google-java-format, black, and
# CPython 3.12 whenever content or the code that compiles it changes.
on:
  push:
    paths:
      - content/**
      - tools/content-cli/**
      - packages/block-compiler/**
      - packages/contracts/**
      - pnpm-lock.yaml
      - .github/workflows/content.yml

permissions:
  contents: read

env:
  GOOGLE_JAVA_FORMAT_VERSION: 1.36.1
  GOOGLE_JAVA_FORMAT_SHA256: 25b400f003089d23cc5320cdaf1a16cabee19b8aa3434d0ff021b3d9f42154b4

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install black
        run: python -m pip install black==26.5.1

      - name: Install google-java-format
        run: |
          jar="$RUNNER_TEMP/google-java-format.jar"
          curl -fsSL -o "$jar" "https://github.com/google/google-java-format/releases/download/v${GOOGLE_JAVA_FORMAT_VERSION}/google-java-format-${GOOGLE_JAVA_FORMAT_VERSION}-all-deps.jar"
          echo "${GOOGLE_JAVA_FORMAT_SHA256}  $jar" | sha256sum --check
          echo "GOOGLE_JAVA_FORMAT_JAR=$jar" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Toolchain tests
        run: pnpm exec vitest run --project @typing-trainer/content-cli
        env:
          CONTENT_TOOLCHAINS: '1'
          PYTHON: python

      - name: Build content with toolchains
        run: pnpm content:build
        env:
          PYTHON: python

      - name: Bundles match the committed ones
        # toolchains.json records local tool versions and is not compared.
        run: |
          git diff --exit-code -- content/dist ':(exclude)content/dist/toolchains.json'
          untracked=$(git status --porcelain --untracked-files=all -- content/dist | grep -v 'content/dist/toolchains.json' || true)
          if [ -n "$untracked" ]; then echo "$untracked"; exit 1; fi
