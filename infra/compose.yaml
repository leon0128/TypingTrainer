# Production composition (§9.7): caddy -> api -> db. The same file deploys to Lightsail and to the
# Raspberry Pi fallback (add compose.pi.yaml there). Configuration comes from infra/.env; copy
# infra/.env.example and see docs/deployment.md.
#
# Images are published to GHCR under one multi-architecture tag (the commit hash from
# infra/docker/version.sh); `docker compose build` builds the same images locally.
name: typing-trainer

x-version: &version '${APP_VERSION:?set APP_VERSION to the tag to deploy, from infra/docker/version.sh}'

services:
  caddy:
    image: ghcr.io/leon0128/typingtrainer-caddy:${APP_VERSION:?}
    build:
      context: ..
      dockerfile: infra/docker/caddy.Dockerfile
    restart: unless-stopped
    environment:
      APP_DOMAIN: '${APP_DOMAIN:?set APP_DOMAIN to the public host name}'
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      # Certificates and the ACME account: losing these only means re-issuing.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

  api:
    image: ghcr.io/leon0128/typingtrainer-api:${APP_VERSION:?}
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      args:
        APP_VERSION: *version
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://typing_trainer:${POSTGRES_PASSWORD:?}@db:5432/typing_trainer
      PASSWORD_PEPPER: '${PASSWORD_PEPPER:?generate one with openssl rand -base64 32}'
      # The public origin the browser uses, scheme and port included (§7, CSRF).
      APP_ORIGIN: '${APP_ORIGIN:?set APP_ORIGIN, for example https://typing.example.com}'
      # Caddy is the only peer that may set X-Forwarded-For: the edge network's own range (§7).
      TRUST_PROXY: 172.28.0.0/24
      NODE_OPTIONS: ${API_NODE_OPTIONS:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, backend]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: typing_trainer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: typing_trainer
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U typing_trainer -d typing_trainer]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port, and only the backend network: the database is reachable from the API alone.
    networks: [backend]

networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  db-data:
