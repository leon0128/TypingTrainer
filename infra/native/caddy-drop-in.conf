# systemd drop-in for caddy.service, installed by setup.sh as
# /etc/systemd/system/caddy.service.d/typing-trainer.conf. The variables (APP_DOMAIN, API_UPSTREAM,
# WEB_ROOT) live in /etc/typing-trainer/caddy.env, apart from the API's secrets.
[Service]
EnvironmentFile=/etc/typing-trainer/caddy.env
# Go's collector otherwise lets the heap grow to twice the live size.
Environment=GOMEMLIMIT=40MiB
MemoryHigh=64M
MemoryMax=96M
