# PostgreSQL tuning for a 512 MB host that also runs the API and Caddy (docs/deployment.md).
# Installed by setup.sh into /etc/postgresql/16/main/conf.d/.
listen_addresses = '127.0.0.1'
# The API's pool holds up to 10 connections; superuser_reserved_connections (3) is taken from this,
# and the rest leaves room for the migration and the backup.
max_connections = 15
shared_buffers = 32MB
work_mem = 2MB
maintenance_work_mem = 16MB
effective_cache_size = 128MB
wal_buffers = 1MB
max_wal_size = 256MB
huge_pages = off
max_worker_processes = 4
max_parallel_workers_per_gather = 0
autovacuum_max_workers = 2
